# =============================================================================
# Datasource
#
# DB_URL / DB_USER / DB_PASSWORD are read directly. On Render a managed database
# arrives instead as a single DATABASE_URL in libpq form, which the JDBC driver
# will not accept - DatabaseUrl splits it into these three before the context
# starts, and never overwrites one that is already set.
# =============================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Small on purpose. Render Postgres allows far fewer connections on the lower
# plans than Hikari would open by default, and every idle one counts against it.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# =============================================================================
# HTTP
# =============================================================================
# Render injects PORT and routes only to it. 8081 is the local default.
server.port=${PORT:8081}

# In-flight requests finish when the platform sends SIGTERM on a redeploy.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# Behind a TLS-terminating proxy - Render, or nginx - honour
# X-Forwarded-Proto/Host so generated URLs (springdoc servers block, redirects)
# use https instead of http.
server.forward-headers-strategy=framework

springdoc.swagger-ui.path=/swagger-ui.html
# Keep the pasted Bearer token across page reloads.
springdoc.swagger-ui.persist-authorization=true

# =============================================================================
# Browser origins
#
# Comma separated, env CORS_ALLOWED_ORIGINS. A `*` is a wildcard inside one host
# or port, so https://*.vercel.app covers preview deployments off the same
# project. This list is also what the OAuth ?redirect= parameter is checked
# against - see FrontendOrigins.
# =============================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://trade-pnl-analysis.vercel.app,https://*.vercel.app,https://prowfin.proweltconsulting.com,https://www.prowfin.proweltconsulting.com,http://localhost:*,http://127.0.0.1:*}

# =============================================================================
# OAuth
# =============================================================================
# Where a login lands when no ?redirect= was given.
app.frontend.base-url=${FRONTEND_BASE_URL:https://trade-pnl-analysis.vercel.app}

# Must match an Authorized redirect URI on the Google OAuth client exactly.
# Render injects RENDER_EXTERNAL_URL, so the default is already correct there -
# set GOOGLE_CALLBACK_URL only behind a custom domain.
app.oauth.google.callback-url=${GOOGLE_CALLBACK_URL:${RENDER_EXTERNAL_URL:http://localhost:8081}/api/v1/auth/callback}

# =============================================================================
# Health
#
# /actuator/health is what the Render health check polls. It reports the
# datasource too, so a service that cannot reach its database fails the deploy
# rather than serving 500s.
# =============================================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# =============================================================================
# Secrets
#
# Broker API credentials are stored encrypted (AES-GCM) in account_credentials.
# Generate a key with:  openssl rand -base64 32
# Left unset the application still starts, but every credential read and write
# fails loudly - which is the intended failure, not silent plaintext.
# =============================================================================
credentials.encryption-key=${CREDENTIAL_ENCRYPTION_KEY:}
