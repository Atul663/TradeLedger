

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
server.port=${PORT:8081}
spring.datasource.driver-class-name=org.postgresql.Driver
springdoc.swagger-ui.path=/swagger-ui.html

# Behind nginx TLS termination: honour X-Forwarded-Proto/Host so generated URLs
# (springdoc servers block, redirects) use https instead of http.
server.forward-headers-strategy=framework

# dhan
dhan.renew-url=https://api.dhan.co/v2/renewToken
dhan.partner-id=${DHAN_PARTNER_ID}
dhan.partner-secret=${DHAN_PARTNER_SECRET}
dhan.consent-id=${DHAN_CONSENT_ID}