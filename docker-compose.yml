services:
  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      TOKEN_SECRET: ${TOKEN_SECRET}
      DHAN_PARTNER_ID: ${DHAN_PARTNER_ID}
      DHAN_PARTNER_SECRET: ${DHAN_PARTNER_SECRET}
      DHAN_CONSENT_ID: ${DHAN_CONSENT_ID}
    restart: always

