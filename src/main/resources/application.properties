

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
server.port=${PORT:8081}
spring.datasource.driver-class-name=org.postgresql.Driver
springdoc.swagger-ui.path=/swagger-ui.html
# Keep the pasted Bearer token across page reloads.
springdoc.swagger-ui.persist-authorization=true

# Behind nginx TLS termination: honour X-Forwarded-Proto/Host so generated URLs
# (springdoc servers block, redirects) use https instead of http.
server.forward-headers-strategy=framework

# Broker API credentials are stored encrypted (AES-GCM) in account_credentials.
# Generate a key with:  openssl rand -base64 32
# Left unset the application still starts, but every credential read and write
# fails loudly - which is the intended failure, not silent plaintext.
credentials.encryption-key=${CREDENTIAL_ENCRYPTION_KEY:}
